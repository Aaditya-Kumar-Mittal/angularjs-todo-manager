<h3>User List</h3>

<div class="input-group mb-3">
  <input type="text" class="form-control" placeholder="New user" ng-model="newUser">
  <div class="input-group-append">
    <button class="btn btn-primary" ng-click="addUser()">Add User</button>
  </div>
</div>

<ul class="list-group">
  <li class="list-group-item d-flex justify-content-between align-items-center" ng-repeat="user in users">
    {{user}}
    <button class="btn btn-sm btn-success" ng-click="openTodos(user)">Open Tasks</button>
  </li>
</ul>

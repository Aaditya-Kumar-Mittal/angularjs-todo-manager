<button class="btn btn-secondary mb-3" ng-click="goBack()">
  ← Back to Users
</button>


<h3>Tasks for {{username}}</h3>

<!-- Add Task -->
<div class="form-group">
  <input type="text" class="form-control" placeholder="Task title" ng-model="newTodo.title">
  <select class="form-control mt-2" ng-model="newTodo.status">
    <option>Pending</option>
    <option>In Progress</option>
    <option>Completed</option>
  </select>
  <button class="btn btn-success mt-2" ng-click="addTodo()">Add Task</button>
</div>

<!-- Task Table -->
<table class="table table-bordered mt-3" ng-if="todos.length">
  <thead>
    <tr>
      <th>#</th>
      <th>Title</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr ng-repeat="task in todos track by $index">
      <td>{{$index + 1}}</td>
      <td><input class="form-control" ng-model="task.title"></td>
      <td>
        <select class="form-control" ng-model="task.status">
          <option>Pending</option>
          <option>In Progress</option>
          <option>Completed</option>
        </select>
      </td>
      <td>
        <button class="btn btn-info btn-sm" ng-click="updateTodo($index)">Update</button>
        <button class="btn btn-danger btn-sm" ng-click="deleteTodo($index)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
